<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AG Tech — Software Engineer & Automation</title>
  <link rel="icon" src="icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet" />

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    /* ─── TOKENS ─────────────────────────────────────────── */
    :root {
      --bg:        #0b0d0e;
      --bg2:       #111416;
      --bg3:       #171a1c;
      --border:    rgba(255,255,255,0.07);
      --border2:   rgba(255,255,255,0.13);
      --fg:        #e8eaeb;
      --fg2:       #8a9099;
      --fg3:       #6a7078;
      --accent:    oklch(0.72 0.18 142);
      --accent2:   oklch(0.72 0.18 200);
      --accent-dim: oklch(0.35 0.10 142);
      --mono:      'JetBrains Mono', monospace;
      --sans:      'Space Grotesk', sans-serif;
    }

    /* ─── RESET ──────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.6;
      overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; }
    img { display: block; }

    /* ─── GRID BACKGROUND ────────────────────────────────── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* ─── NAV ────────────────────────────────────────────── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2.5rem;
      height: 60px;
      background: rgba(11,13,14,0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .nav-logo {
      font-family: var(--mono);
      font-weight: 700;
      font-size: 1rem;
      color: var(--accent);
      letter-spacing: 0.05em;
    }
    .nav-logo span { color: var(--fg2); font-weight: 300; }
    .nav-links {
      display: flex;
      gap: 2rem;
      list-style: none;
    }
    .nav-links a {
      font-family: var(--mono);
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--fg2);
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--accent); }
    .nav-cta {
      font-family: var(--mono);
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.45rem 1.1rem;
      border: 1px solid var(--accent);
      color: var(--accent);
      border-radius: 2px;
      transition: background 0.2s, color 0.2s;
    }
    .nav-cta:hover { background: var(--accent); color: var(--bg); }

    /* ─── SECTIONS ───────────────────────────────────────── */
    section { position: relative; z-index: 1; }

    /* ─── HERO ───────────────────────────────────────────── */
    #hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 120px 2.5rem 80px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .hero-tag {
      font-family: var(--mono);
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .hero-tag::before {
      content: '';
      display: inline-block;
      width: 24px; height: 1px;
      background: var(--accent);
    }
    .hero-headline {
      font-size: clamp(2.8rem, 6vw, 5.5rem);
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: -0.02em;
      color: var(--fg);
      max-width: 900px;
      margin-bottom: 1.5rem;
    }
    .hero-headline em {
      font-style: normal;
      color: var(--accent);
    }
    .hero-sub {
      font-family: var(--mono);
      font-size: 1rem;
      color: var(--fg2);
      max-width: 560px;
      line-height: 1.7;
    }
    .hero-actions {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .btn-primary {
      font-family: var(--mono);
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.85rem 2rem;
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 2px;
      cursor: pointer;
      font-weight: 700;
      transition: opacity 0.2s, transform 0.2s;
    }
    .btn-primary:hover { opacity: 0.85; transform: translateY(-1px); }
    .btn-secondary {
      font-family: var(--mono);
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.85rem 2rem;
      background: transparent;
      color: var(--fg);
      border: 1px solid var(--border2);
      border-radius: 2px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }
    .btn-secondary:hover { border-color: var(--fg2); color: var(--fg); }

    /* hero bottom row: photo + terminal */
    .hero-bottom {
      margin-top: 4rem;
      display: flex;
      gap: 2rem;
      align-items: flex-start;
      flex-wrap: wrap;
	  margin-bottom: 4rem;
    }

    /* photo card */
    .hero-photo {
      flex-shrink: 0;
      border: 1px solid var(--border2);
      border-radius: 3px;
      overflow: hidden;
      position: relative;
      background: var(--bg3);
    }
    .hero-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }
    .hero-photo-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      padding: 1.5rem;
      text-align: center;
    }
    .hero-photo-placeholder svg {
      opacity: 0.25;
    }
    .hero-photo-placeholder span {
      font-family: var(--mono);
      font-size: 0.62rem;
      letter-spacing: 0.1em;
      color: var(--fg3);
      font-weight: 600;
      line-height: 1.6;
    }
    /* accent corner tag */
    .hero-photo::after {
      content: 'AG';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 0.5rem 0.75rem;
      background: linear-gradient(transparent, rgba(0,0,0,0.75));
      font-family: var(--mono);
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      color: var(--accent);
      text-align: right;
    }

    /* terminal block */
    .hero-terminal {
      flex: 1;
      min-width: 280px;
      background: var(--bg2);
      border: 1px solid var(--border2);
      border-radius: 4px;
      overflow: hidden;
    }
    .terminal-bar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 1rem;
      background: var(--bg3);
      border-bottom: 1px solid var(--border);
    }
    .terminal-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
    }
    .terminal-dot.r { background: #ff5f57; }
    .terminal-dot.y { background: #ffbd2e; }
    .terminal-dot.g { background: #27c93f; }
    .terminal-title {
      font-family: var(--mono);
      font-size: 0.65rem;
      color: var(--fg3);
      font-weight: 600;
      margin-left: 0.5rem;
    }
    .terminal-body {
      padding: 1.25rem 1.5rem;
      font-family: var(--mono);
      font-size: 0.8rem;
      line-height: 2;
    }
    .terminal-line { display: flex; gap: 0.75rem; }
    .terminal-prompt { color: var(--accent); }
    .terminal-cmd { color: var(--fg); }
    .terminal-out { color: var(--fg2); padding-left: 1.5rem; }
    .terminal-cursor {
      display: inline-block;
      width: 8px; height: 1em;
      background: var(--accent);
      animation: blink 1.1s step-end infinite;
      vertical-align: text-bottom;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    /* ─── SECTION WRAPPER ─────────────────────────────────── */
    .section-wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 100px 2.5rem;
    }
    .section-label {
      font-family: var(--mono);
      font-size: 0.68rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 3rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .section-label::after {
      content: '';
      flex: 1;
      max-width: 80px;
      height: 1px;
      background: var(--accent-dim);
    }
    .section-title {
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.1;
      color: var(--fg);
      margin-bottom: 1.5rem;
    }
    .section-sep {
      width: 100%;
      height: 1px;
      background: var(--border);
      margin: 0;
    }

    /* ─── ABOUT ──────────────────────────────────────────── */
    #about { background: var(--bg2); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5rem;
      align-items: start;
    }
    .about-body {
      font-size: 1.05rem;
      color: var(--fg2);
      line-height: 1.8;
    }
    .about-body p + p { margin-top: 1.25rem; }
    .about-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
    }
    .stat-cell {
      background: var(--bg2);
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .stat-num {
      font-family: var(--mono);
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
    }
.stat-label {
      font-family: var(--mono);
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--fg3);
      font-weight: 600;
    }
    .about-clients {
      margin-top: 2rem;
    }
    .clients-label {
      font-family: var(--mono);
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--fg3);
      font-weight: 600;
    }
    .about-clients {
      margin-top: 2rem;
    }
    .clients-label {
      font-family: var(--mono);
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--fg3);
      margin-bottom: 1rem;
    }
    .clients-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .client-chip {
      font-family: var(--mono);
      font-size: 0.7rem;
      letter-spacing: 0.06em;
      padding: 0.3rem 0.75rem;
      border: 1px solid var(--border2);
      color: var(--fg2);
      border-radius: 2px;
    }

    /* ─── SERVICES ───────────────────────────────────────── */
    .services-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
      margin-top: 3rem;
    }
    .service-card {
      background: var(--bg);
      padding: 2.5rem 2rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      transition: background 0.25s;
      cursor: default;
    }
    .service-card:hover { background: var(--bg3); }
    .service-num {
      font-family: var(--mono);
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      color: var(--accent);
    }
    .service-name {
      font-size: 1.3rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--fg);
    }
    .service-desc {
      font-size: 0.9rem;
      color: var(--fg2);
      line-height: 1.7;
      flex: 1;
    }
    .service-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.5rem;
    }
    .tag {
      font-family: var(--mono);
      font-size: 0.62rem;
      letter-spacing: 0.06em;
      padding: 0.2rem 0.6rem;
      background: var(--accent-dim);
      color: var(--accent);
      border-radius: 2px;
    }

    /* ─── STACK ──────────────────────────────────────────── */
    #stack { background: var(--bg2); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
    .stack-rows { margin-top: 3rem; display: flex; flex-direction: column; gap: 1px; background: var(--border); border: 1px solid var(--border); }
    .stack-row {
      display: grid;
      grid-template-columns: 180px 1fr;
      background: var(--bg2);
    }
    .stack-cat {
      font-family: var(--mono);
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--fg3);
      font-weight: 600;
      padding: 1.25rem 1.5rem;
      border-right: 1px solid var(--border);
      display: flex;
      align-items: center;
    }
    .stack-items {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      padding: 1rem 1.5rem;
      align-items: center;
    }
    .stack-pill {
      font-family: var(--mono);
      font-size: 0.75rem;
      padding: 0.35rem 0.9rem;
      border: 1px solid var(--border2);
      color: var(--fg);
      border-radius: 2px;
      transition: border-color 0.2s, color 0.2s;
    }
    .stack-pill:hover { border-color: var(--accent); color: var(--accent); }
    .stack-pill.primary { border-color: var(--accent-dim); color: var(--accent); background: rgba(0,0,0,0.3); }

    /* ─── PROJECTS ───────────────────────────────────────── */
    .projects-list { margin-top: 3rem; display: flex; flex-direction: column; gap: 1px; background: var(--border); border: 1px solid var(--border); }
    .project-row {
      display: grid;
      grid-template-columns: 60px 1fr auto;
      align-items: center;
      background: var(--bg);
      padding: 2rem 2rem;
      gap: 2rem;
      transition: background 0.2s;
      cursor: default;
    }
    .project-row:hover { background: var(--bg3); }
    .project-index {
      font-family: var(--mono);
      font-size: 0.65rem;
      color: var(--fg3);
      font-weight: 600;
      letter-spacing: 0.1em;
    }
    .project-info { display: flex; flex-direction: column; gap: 0.4rem; }
    .project-name {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--fg);
      letter-spacing: -0.01em;
    }
    .project-desc {
      font-size: 0.88rem;
      color: var(--fg2);
      line-height: 1.6;
      max-width: 560px;
    }
    .project-tags { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-top: 0.5rem; }
    .project-status {
      font-family: var(--mono);
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .project-status::before {
      content: '';
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
    }

    /* ─── CONTACT ────────────────────────────────────────── */
    #contact { background: var(--bg2); border-top: 1px solid var(--border); }
    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1.3fr;
      gap: 5rem;
      align-items: start;
    }
    .contact-info { display: flex; flex-direction: column; gap: 2rem; }
    .contact-blurb {
      font-size: 1.05rem;
      color: var(--fg2);
      line-height: 1.8;
    }
    .contact-links { display: flex; flex-direction: column; gap: 0.75rem; }
    .contact-link {
      display: flex;
      align-items: center;
      gap: 1rem;
      font-family: var(--mono);
      font-size: 0.8rem;
      color: var(--fg2);
      transition: color 0.2s;
    }
    .contact-link:hover { color: var(--accent); }
    .contact-link-icon {
      width: 32px; height: 32px;
      border: 1px solid var(--border2);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    /* form */
    .contact-form { display: flex; flex-direction: column; gap: 1rem; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
    .form-label {
      font-family: var(--mono);
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--fg3);
      font-weight: 600;
    }
    .form-input, .form-textarea {
      background: var(--bg3);
      border: 1px solid var(--border2);
      color: var(--fg);
      font-family: var(--mono);
      font-size: 0.85rem;
      padding: 0.75rem 1rem;
      border-radius: 2px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-input:focus, .form-textarea:focus { border-color: var(--accent); }
    .form-textarea { resize: vertical; min-height: 120px; }
    .form-submit {
      font-family: var(--mono);
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 700;
      padding: 0.9rem 2rem;
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 2px;
      cursor: pointer;
      transition: opacity 0.2s;
      align-self: flex-start;
    }
    .form-submit:hover { opacity: 0.85; }

    /* ─── FOOTER ─────────────────────────────────────────── */
    footer {
      position: relative; z-index: 1;
      border-top: 1px solid var(--border);
      padding: 2rem 2.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .footer-logo {
      font-family: var(--mono);
      font-size: 0.8rem;
      color: var(--fg3);
      font-weight: 600;
    }
    .footer-logo strong { color: var(--accent); }
    .footer-copy {
      font-family: var(--mono);
      font-size: 0.65rem;
      color: var(--fg3);
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    /* ─── ANIMATIONS ─────────────────────────────────────── */
    .fade-up {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .fade-up.visible { opacity: 1; transform: translateY(0); }

    /* ─── RESPONSIVE ─────────────────────────────────────── */
    @media (max-width: 768px) {
      nav { padding: 0 1.25rem; }
      .nav-links { display: none; }
      .section-wrap { padding: 70px 1.25rem; }
      .about-grid, .contact-grid { grid-template-columns: 1fr; gap: 2.5rem; }
      .services-grid { grid-template-columns: 1fr; }
      .stack-row { grid-template-columns: 120px 1fr; }
      .project-row { grid-template-columns: 40px 1fr; }
      .project-status { display: none; }
      .form-row { grid-template-columns: 1fr; }
      .hero-bottom { flex-direction: column; }
      .hero-photo { max-width: 100%; aspect-ratio: 1 / 1; }
    }
  </style>
</head>
<body>

  <!-- ─── REACT APP ──────────────────────────────────────── -->
  <script type="text/babel" src="tweaks-panel.jsx"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    /* ── TWEAKS ────────────────────────────────────────────── */
    const TWEAK_DEFAULS = /*EDITMODE-BEGIN*/{

    }/*EDITMODE-END*/;

    /* ── TRANSLATIONS ──────────────────────────────────────── */
    const T = {

        },

    /* ── TERMINAL ──────────────────────────────────────────── */
    function Terminal({ lines }) {
      const [rendered, setRendered] = useState([]);
      const idx = useRef(0);
      const timerRef = useRef(null);

      useEffect(() => {
        setRendered([]);
        idx.current = 0;
        clearInterval(timerRef.current);
        timerRef.current = setInterval(() => {
          if (idx.current < lines.length) {
            const captured = idx.current;
            setRendered(prev => [...prev, lines[captured]]);
            idx.current++;
          } else {
            clearInterval(timerRef.current);
          }
        }, 520);
        return () => clearInterval(timerRef.current);
      }, [lines]);

      return (
        <div className="terminal-body">
          {rendered.map((line, i) => (
            <div key={i} className="terminal-line">
              {line.type === 'cmd' && <span className="terminal-prompt">❯</span>}
              <span className={line.type === 'out' ? 'terminal-out' : 'terminal-cmd'}
                    style={line.accent ? {color:'var(--accent)', paddingLeft:'1.5rem'} : {}}>
                {line.text}
              </span>
            </div>
          ))}
          {idx.current < lines.length && (
            <div className="terminal-line">
              <span className="terminal-prompt">❯</span>
              <span className="terminal-cursor"></span>
            </div>
          )}
        </div>
      );
    }

    /* ── CONTACT FORM ──────────────────────────────────────── */
    function ContactForm({ t }) {
      const f = t.contact.fields;
      const [form, setForm] = useState({ name: '', email: '', company: '', message: '' });
      const [status, setStatus] = useState('idle');

      const handle = (e) => setForm(prev => ({...prev, [e.target.name]: e.target.value}));
      const submit = async (e) => {
        e.preventDefault();
        setStatus('sending');
        try {
          const res = await fetch('https://formspree.io/f/xykvoken', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(form),
          });
          if (res.ok) {
            setStatus('sent');
          } else {
            setStatus('idle');
            alert('Something went wrong. Please try again or email me directly at alessio.grasselli@outlook.com');
          }
        } catch {
          setStatus('idle');
          alert('Network error. Please try again or email me directly at alessio.grasselli@outlook.com');
        }
      };

      if (status === 'sent') {
        return (
          <div style={{display:'flex',flexDirection:'column',gap:'1rem',padding:'2.5rem',background:'var(--bg3)',border:'1px solid var(--border2)',borderRadius:'2px'}}>

            <div style={{fontSize:'1.1rem',fontWeight:600,color:'var(--fg)'}}>{t.contact.successMsg}</div>
            <div style={{fontFamily:'var(--mono)',fontSize:'0.8rem',color:'var(--fg2)'}}>{t.contact.successSub}</div>
          </div>
        );
      }

      return (
        <form className="contact-form" onSubmit={submit}>
          <div className="form-row">
            <div className="form-group">
              <label className="form-label">{f.name}</label>
              <input className="form-input" name="name" value={form.name} onChange={handle} required placeholder={f.namePh} />
            </div>
            <div className="form-group">
              <label className="form-label">{f.email}</label>
              <input className="form-input" type="email" name="email" value={form.email} onChange={handle} required placeholder="hello@company.com" />
            </div>
          </div>
          <div className="form-group">
            <label className="form-label">{f.company}</label>
            <input className="form-input" name="company" value={form.company} onChange={handle} placeholder={f.companyPh} />
          </div>
          <div className="form-group">
            <label className="form-label">{f.message}</label>
            <textarea className="form-textarea" name="message" value={form.message} onChange={handle} required placeholder={f.messagePh} />
          </div>
          <button className="form-submit" type="submit" disabled={status === 'sending'}>
            {status === 'sending' ? f.sending : f.submit}

        </form>
      );

    /* ── SCROLL ANIMATIONS ─────────────────────────────────── */
    // Re-observe after React renders
    const observeFadeUps = () => {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
      }, { threshold: 0.12 });
      document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));
    };
